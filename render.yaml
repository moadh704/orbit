# Free-tier friendly Orbit deploy (one Web Service + MySQL)
# In Render Dashboard: New → Blueprint → connect moadh704/orbit
services:
  - type: web
    name: orbit
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          name: orbit
          type: web
          property: host
      - key: DB_HOST
        fromDatabase:
          name: orbit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: orbit-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: orbit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: orbit-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: orbit-db
          property: database

databases:
  - name: orbit-db
    plan: free
    databaseName: orbit
    user: orbit
